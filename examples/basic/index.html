<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>maplibre-gl-atlas example</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link
  rel="stylesheet"
  href="https://unpkg.com/maplibre-gl@^6/dist/maplibre-gl.css"
/>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  #map { position: absolute; inset: 0; }

  /* Ported from dwg7/zukaku's docs/index.html (ADR 0005): the page grid is
     fixed to the screen center, not to the map — the user pans/zooms the
     map underneath it to line up the area they want. Hidden outside atlas
     mode (state ⓪, see the toggle button below). */
  #grid-overlay {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 5; pointer-events: none; display: none;
  }
  #grid-overlay.visible { display: grid; }
  #grid-overlay { outline: 2px solid rgba(0, 0, 0, 0.6); }
  #grid-overlay .cell { border: 1px solid rgba(0, 0, 0, 0.6); box-sizing: border-box; }

  /* Atlas panel — the state-① UI: grid size/orientation, Print, and the
     title field. Hidden until atlas mode is entered via the toggle button. */
  #atlas-panel {
    display: none;
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    z-index: 6; flex-direction: column; gap: 6px; align-items: center;
    background: rgba(255, 255, 255, 0.92); border-radius: 4px;
    padding: 8px 10px; font: 12px/1.4 system-ui, sans-serif; color: #333;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
  }
  #atlas-panel.visible { display: flex; }
  #atlas-panel .row { display: flex; gap: 8px; align-items: center; }
  #atlas-panel button { font: inherit; cursor: pointer; }
  #atlas-panel .step { width: 22px; height: 22px; border-radius: 3px; border: 1px solid #999; background: #fff; }
  #atlas-panel .value { min-width: 1.2em; text-align: center; font-weight: bold; }
  #atlas-panel .sep { font-weight: bold; color: #666; }
  #orientation-toggle { padding: 0 10px; height: 22px; border-radius: 3px; border: 1px solid #999; background: #fff; }
  #print-btn {
    padding: 0 12px; height: 24px; border-radius: 3px; border: 1px solid #1a73e8;
    background: #1a73e8; color: #fff; font-weight: bold;
  }
  #title-input { width: 220px; padding: 3px 6px; font: inherit; border: 1px solid #999; border-radius: 3px; }

  /* Custom top-right toggle button (⓪⇄①) — matches maplibregl's own
     control button chrome so it sits alongside NavigationControl etc.
     without looking out of place. */
  #atlas-toggle-btn[aria-pressed="true"] { background: #e8eaed; }
</style>
<script type="importmap">
{
  "imports": {
    "maplibre-gl": "https://unpkg.com/maplibre-gl@^6/dist/maplibre-gl.mjs"
  }
}
</script>
</head>
<body>
<div id="map"></div>
<div id="grid-overlay"></div>

<div id="atlas-panel">
  <div class="row">
    <button type="button" class="step" data-adjust="rows" data-delta="-1">−</button>
    <span class="value" id="rows-value">1</span>
    <button type="button" class="step" data-adjust="rows" data-delta="1">+</button>
    <span class="sep">×</span>
    <button type="button" class="step" data-adjust="cols" data-delta="-1">−</button>
    <span class="value" id="cols-value">3</span>
    <button type="button" class="step" data-adjust="cols" data-delta="1">+</button>
    <button type="button" id="orientation-toggle">portrait</button>
    <button type="button" id="print-btn">Print</button>
  </div>
  <div class="row">
    <input id="title-input" type="text" placeholder="Map title (optional)" maxlength="60">
  </div>
</div>

<script type="module">
  // This example has no build step — it imports maplibre-gl (via the
  // importmap above) and @dwg7/maplibre-gl-atlas straight from a CDN, the
  // same way maplibre-gl itself is meant to be dropped into a plain HTML
  // page. The importmap is required because @dwg7/maplibre-gl-atlas's own
  // build imports the bare specifier "maplibre-gl" (maplibre-gl is a peer
  // dependency, not bundled) — without it, the browser can't resolve that
  // import. Swap the @dwg7/maplibre-gl-atlas URL for a local
  // `../../dist/maplibre-gl-atlas.js` build when developing against this
  // repo's own source.
  import { Map } from "maplibre-gl";
  import { AtlasControl } from "https://unpkg.com/@dwg7/maplibre-gl-atlas/dist/maplibre-gl-atlas.js";

  // stars.optgeo.org (hfu/stars) hosts the same MapLibre styles
  // dwg7/zukaku's range-selection UI uses — positron is global OSM-planet
  // coverage, so it renders anywhere, unlike zukaku's Japan-only styles.
  const DEMO_STYLE = "https://stars.optgeo.org/style/positron";

  // A4 aspect ratio (width/height) — matches dwg7/zukaku's docs/index.html.
  const A4_ASPECT = { portrait: 210 / 297, landscape: 297 / 210 };
  const BASE_CELL_WIDTH = 130; // on-screen preview cell width, CSS px

  const state = { rows: 1, cols: 3, orientation: "portrait", title: "", atlasMode: false };

  const map = new Map({
    container: "map",
    style: DEMO_STYLE,
    center: [141.3545, 43.0621],
    zoom: 15,
    // Namespaced hash ("#map=z/lat/lng/...") so the URL is shareable without
    // clobbering any other app state that might share the fragment — the
    // pattern dwg7/zukaku and dwg7/height-coverage already use.
    hash: "map",
    // dwg7/zukaku locks rotation for the same reason (ADR 0005, 2026-08-31
    // addendum): the grid math below unprojects two screen corners into a
    // bbox — only a valid axis-aligned rectangle when bearing is 0.
    dragRotate: false,
    pitchWithRotate: false,
  });
  map.touchZoomRotate.disableRotation();

  // --- m x n grid + orientation, ported from dwg7/zukaku's docs/index.html
  // (renderGrid()/computePages(), ADR 0005) — this is *the* fix for two
  // problems an earlier, hardcoded-bounds version of this example had: no
  // way to change how many sheets print, and a paper aspect ratio that
  // didn't actually match the printed page (hand-picked lng/lat spans have
  // no reason to land on 210:297). Deriving each cell's bounds from
  // map.unproject() on a screen-space rectangle that's already sized to the
  // target page aspect ratio fixes both at once.
  const gridOverlay = document.getElementById("grid-overlay");
  const rowsValue = document.getElementById("rows-value");
  const colsValue = document.getElementById("cols-value");
  const orientationToggle = document.getElementById("orientation-toggle");

  function renderGrid() {
    const aspect = A4_ASPECT[state.orientation]; // width / height
    const cellWidth = BASE_CELL_WIDTH;
    const cellHeight = cellWidth / aspect;
    const totalWidth = cellWidth * state.cols;
    const totalHeight = cellHeight * state.rows;
    const maxWidth = window.innerWidth * 0.7;
    const maxHeight = window.innerHeight * 0.6;
    const scale = Math.min(1, maxWidth / totalWidth, maxHeight / totalHeight);

    gridOverlay.style.gridTemplateColumns = `repeat(${state.cols}, 1fr)`;
    gridOverlay.style.gridTemplateRows = `repeat(${state.rows}, 1fr)`;
    gridOverlay.style.width = `${totalWidth * scale}px`;
    gridOverlay.style.height = `${totalHeight * scale}px`;

    gridOverlay.innerHTML = "";
    for (let i = 0; i < state.rows * state.cols; i++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      gridOverlay.appendChild(cell);
    }

    rowsValue.textContent = String(state.rows);
    colsValue.textContent = String(state.cols);
    orientationToggle.textContent = state.orientation;
  }

  document.getElementById("atlas-panel").addEventListener("click", (e) => {
    const stepBtn = e.target.closest("button[data-adjust]");
    if (stepBtn) {
      const key = stepBtn.dataset.adjust;
      const delta = Number(stepBtn.dataset.delta);
      state[key] = Math.min(6, Math.max(1, state[key] + delta));
      renderGrid();
      return;
    }
    if (e.target === orientationToggle) {
      state.orientation = state.orientation === "portrait" ? "landscape" : "portrait";
      renderGrid();
    }
  });
  document.getElementById("title-input").addEventListener("input", (e) => {
    state.title = e.target.value.trim();
  });
  window.addEventListener("resize", () => {
    if (state.atlasMode) renderGrid();
  });
  renderGrid();

  // --- Atlas mode toggle (state ⓪ ⇄ ①) ---
  // A plugin control shouldn't permanently occupy the map with a grid
  // overlay and panel — those only make sense once someone has actually
  // asked to build an atlas. The library's own button (print icon,
  // showButton:true) doesn't fit that: it's a single-purpose print
  // trigger. So this example drives AtlasControl with showButton:false and
  // supplies its own top-right toggle button instead, whose only job is
  // entering/leaving the grid-editing UI below (state ①). The actual
  // print action (state ②) lives inside that UI, as the dedicated Print
  // button, which calls the control's own review()/print() — see adr/0002
  // in the library repo for why review() (not print() directly) is the
  // right thing for a human-facing button to call.
  class AtlasModeToggle {
    onAdd() {
      this.container = document.createElement("div");
      this.container.className = "maplibregl-ctrl maplibregl-ctrl-group";
      this.button = document.createElement("button");
      this.button.type = "button";
      this.button.id = "atlas-toggle-btn";
      this.button.setAttribute("aria-pressed", "false");
      this.setIdle();
      this.button.addEventListener("click", () => setAtlasMode(!state.atlasMode));
      this.container.appendChild(this.button);
      return this.container;
    }
    onRemove() {
      this.container.remove();
    }
    setIdle() {
      this.button.textContent = "▦";
      this.button.title = "Enter atlas mode";
      this.button.setAttribute("aria-label", "Enter atlas mode");
      this.button.setAttribute("aria-pressed", "false");
    }
    setActive() {
      this.button.textContent = "✕";
      this.button.title = "Exit atlas mode";
      this.button.setAttribute("aria-label", "Exit atlas mode");
      this.button.setAttribute("aria-pressed", "true");
    }
  }

  function setAtlasMode(on) {
    state.atlasMode = on;
    gridOverlay.classList.toggle("visible", on);
    document.getElementById("atlas-panel").classList.toggle("visible", on);
    if (on) {
      atlasToggle.setActive();
      renderGrid();
    } else {
      atlasToggle.setIdle();
    }
  }

  // Per-cell bbox via the live map's own map.unproject() — the same
  // projection MapLibre uses internally, rather than re-deriving Mercator
  // math by hand (dwg7/zukaku ADR 0005) — stays correct regardless of
  // center/zoom.
  function computeSheets() {
    const rect = gridOverlay.getBoundingClientRect();
    const cellWidth = rect.width / state.cols;
    const cellHeight = rect.height / state.rows;
    const headerLeft = state.title ? `Atlas Example: ${state.title}` : "Atlas Example";

    const detailSheets = [];
    const cells = [];
    for (let r = 0; r < state.rows; r++) {
      for (let c = 0; c < state.cols; c++) {
        const left = rect.left + c * cellWidth;
        const top = rect.top + r * cellHeight;
        const nw = map.unproject([left, top]);
        const se = map.unproject([left + cellWidth, top + cellHeight]);
        const ref = `${String.fromCharCode(65 + r)}${c + 1}`;
        const bounds = [nw.lng, se.lat, se.lng, nw.lat]; // west, south, east, north
        cells.push({ ref, bounds });
        detailSheets.push({
          role: "detail",
          style: DEMO_STYLE,
          bounds,
          orientation: state.orientation,
          headerLeft,
          headerRight: ref,
        });
      }
    }

    const overallNW = map.unproject([rect.left, rect.top]);
    const overallSE = map.unproject([rect.left + rect.width, rect.top + rect.height]);
    // Whichever A4 orientation better matches the full grid's aspect ratio,
    // so the index sheet doesn't waste paper on empty margins.
    const overallAspect = (state.cols / state.rows) * A4_ASPECT[state.orientation];
    const overviewOrientation = overallAspect >= 1 ? "landscape" : "portrait";

    const indexSheet = {
      role: "index",
      style: DEMO_STYLE,
      bounds: [overallNW.lng, overallSE.lat, overallSE.lng, overallNW.lat],
      orientation: overviewOrientation,
      headerLeft,
      headerRight: "Index",
      // Breathing room around the grid block, scaled with the grid so it
      // stays visually proportional once renderScale shrinks it back down.
      padding: 50 * Math.max(state.cols, state.rows),
      // Zoom-level shift (dwg7/zukaku ADR 0009): stage the index sheet in a
      // container this many times bigger per axis, so it fits the same bbox
      // at roughly the zoom level a detail sheet would use.
      renderScale: { x: state.cols, y: state.rows },
      decorate: (offscreenMap) => {
        // The seam for atlas-specific drawing — this library has no idea
        // what a "grid" is, so the caller draws its own reference
        // rectangles/labels here, exactly like dwg7/zukaku's
        // addOverviewGridLayers() does.
        const features = cells.map((cell) => ({
          type: "Feature",
          properties: { ref: cell.ref },
          geometry: {
            type: "Polygon",
            coordinates: [
              [
                [cell.bounds[0], cell.bounds[3]],
                [cell.bounds[2], cell.bounds[3]],
                [cell.bounds[2], cell.bounds[1]],
                [cell.bounds[0], cell.bounds[1]],
                [cell.bounds[0], cell.bounds[3]],
              ],
            ],
          },
        }));
        offscreenMap.addSource("example-grid", {
          type: "geojson",
          data: { type: "FeatureCollection", features },
        });
        offscreenMap.addLayer({
          id: "example-grid-lines",
          type: "line",
          source: "example-grid",
          paint: { "line-color": "#000", "line-width": 1.5 },
        });
        offscreenMap.addLayer({
          id: "example-grid-labels",
          type: "symbol",
          source: "example-grid",
          layout: {
            "text-field": ["get", "ref"],
            "text-size": 28,
            "symbol-placement": "point",
          },
          paint: { "text-color": "#000", "text-halo-color": "#fff", "text-halo-width": 2 },
        });
      },
    };

    return [indexSheet, ...detailSheets];
  }

  const atlasControl = new AtlasControl({
    sheets: computeSheets,
    showButton: false, // this example drives printing from its own Print button (state ①) instead
    onError: (err) => {
      console.error("Atlas print failed:", err);
      alert(`Atlas print failed: ${err}`);
    },
  });
  map.addControl(atlasControl, "top-right");

  const atlasToggle = new AtlasModeToggle();
  map.addControl(atlasToggle, "top-right");

  document.getElementById("print-btn").addEventListener("click", () => {
    atlasControl.review().catch((err) => console.error("Atlas print failed:", err));
  });
</script>
</body>
</html>
